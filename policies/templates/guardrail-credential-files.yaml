{{- if .Values.guardrails.enabled }}
# Denylist: nothing in an Agent may open the ServiceAccount token. The projected token lives under
# a ..<timestamp> directory, so match the directory by prefix, not the file name (ADR 0003).
# Override needs kprobe-multi off, or Tetragon rejects the policy at load while the CRD still applies.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: guardrail-credential-files
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: agent-swarm
spec:
  options:
    - name: disable-kprobe-multi
      value: "1"
  podSelector:
    {{- include "swarm.guardrailSelector" . | nindent 4 }}
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /var/run/secrets/kubernetes.io/serviceaccount
                - /run/secrets/kubernetes.io/serviceaccount
          matchActions:
            - action: Override
              argError: -1
            - action: Sigkill
{{- end }}
