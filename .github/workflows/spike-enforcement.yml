name: spike-enforcement

on:
  push:
    branches: ['spike/gha-enforcement']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1.15.2
        with:
          install_only: true
          version: v0.33.0
      - name: Run spike
        env:
          TETRAGON_VERSION: 1.8.0
        run: spike/run.sh
