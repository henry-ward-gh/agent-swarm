name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - name: Validate every root and module
        run: |
          for d in terraform/modules/* terraform/envs/*/*; do
            echo "::group::$d"
            terraform -chdir="$d" init -input=false -backend=false -lockfile=readonly
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - name: Module tests
        run: task tf:test
      - name: Plan the cluster stage
        run: |
          terraform -chdir=terraform/envs/kind/cluster init -input=false -lockfile=readonly
          terraform -chdir=terraform/envs/kind/cluster plan -input=false

  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

  up:
    # The real thing: both stages on kind, then Argo CD must sync the root app
    # at exactly this commit, from the repo the commit lives in (fork-safe).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
          install_only: true
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - name: task up
        run: task up TARGET_REVISION="$REVISION" REPO_URL="$REPO_URL" TAG="$REVISION"
      - name: Argo CD syncs the root app at this commit
        run: |
          kubectl -n argocd wait applications.argoproj.io/root \
            --for=jsonpath='{.status.sync.status}'=Synced --timeout=5m
          kubectl -n argocd wait applications.argoproj.io/root \
            --for=jsonpath='{.status.health.status}'=Healthy --timeout=5m
          got=$(kubectl -n argocd get configmap root-info -o jsonpath='{.data.targetRevision}')
          echo "root-info.targetRevision=$got"
          test "$got" = "$REVISION"
          test "$(kubectl -n argocd get configmap root-info -o jsonpath='{.data.imageTag}')" = "$REVISION"
      - name: Platform apps are Synced and Healthy
        run: |
          # Every child the root chart rendered (root is Synced, so they all exist).
          apps=$(kubectl -n argocd get applications.argoproj.io -o name)
          apps=$(printf '%s\n' "$apps" | grep -v '/root$')
          test -n "$apps"
          for app in $apps; do
            kubectl -n argocd wait "$app" \
              --for=jsonpath='{.status.sync.status}'=Synced --timeout=8m
            kubectl -n argocd wait "$app" \
              --for=jsonpath='{.status.health.status}'=Healthy --timeout=8m
          done
      - name: Tetragon events carry pod metadata
        run: |
          kubectl -n kube-system rollout status ds/tetragon --timeout=5m
          # Generate process activity in a pod, then look for it in the event stream.
          kubectl run probe --image=busybox:1.37 --restart=Never -- sh -c 'sleep 5; echo done'
          kubectl wait pod/probe --for=jsonpath='{.status.phase}'=Succeeded --timeout=2m
          for _ in $(seq 1 30); do
            # One Tetragon pod per node: read them all, the probe's node is not known.
            if kubectl -n kube-system logs -l app.kubernetes.io/name=tetragon -c export-stdout \
                --tail=-1 --max-log-requests=10 \
                | grep -q '"pod":{[^}]*"name":"probe"'; then
              echo "event with pod metadata found"; exit 0
            fi
            sleep 5
          done
          echo "no Tetragon event carried pod metadata" >&2; exit 1
      - name: Guardrails block rogue Scenarios
        run: scripts/check-guardrails.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n argocd get applications.argoproj.io -o wide || true
          kubectl -n argocd get applications.argoproj.io root -o yaml || true
          kubectl -n argocd get pods -o wide || true
          kubectl -n kube-system logs -l app.kubernetes.io/name=tetragon -c export-stdout --tail=20 --max-log-requests=10 || true
          kubectl -n swarm-demo get pods,tracingpolicynamespaced -o wide || true
          # Which resources of each child Application are not Synced, and why.
          kubectl -n argocd get applications.argoproj.io -o json \
            | jq '.items[] | {app: .metadata.name, conditions: .status.conditions, op: .status.operationState.message,
                outOfSync: [.status.resources[]? | select(.status != "Synced") | {kind, name, status, message}]}' || true
          kubectl -n swarm-demo get tracingpolicynamespaced -o yaml | head -150 || true
          kubectl -n outside-world get pods,svc -o wide || true
          kubectl -n kube-system logs -l app.kubernetes.io/name=tetragon -c tetragon --tail=60 --max-log-requests=10 | grep -iE 'error|fail' || true
      - name: task down
        if: always()
        run: task down
