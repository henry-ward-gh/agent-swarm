# Picked up by Grafana's datasource sidecar (label from kube-prometheus-stack's defaults).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/part-of: agent-swarm
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: {{ .Values.lokiURL }}
