apiVersion: v1
kind: ConfigMap
metadata:
  name: outside-world-server
  labels:
    app.kubernetes.io/part-of: agent-swarm
data:
  server.py: |
    {{- .Files.Get "files/server.py" | nindent 4 }}
{{- range $name, $s := .Values.servers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: agent-swarm
    agent-swarm.io/component: outside-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: agent-swarm
        agent-swarm.io/component: outside-world
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ $.Values.image }}
          command: ["python", "-u", "/app/server.py"]
          env:
            - name: MODE
              value: {{ $s.mode | quote }}
            - name: PORT
              value: {{ $.Values.port | quote }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: {{ $.Values.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: server
              mountPath: /app
      volumes:
        - name: server
          configMap:
            name: outside-world-server
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: agent-swarm
spec:
  {{- with $s.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: http
{{- end }}
