# argo-cd chart values (ADR 0005). The Terraform bootstrap installs Argo CD
# with these; the self-managed Argo CD Application (added with the GitOps
# platform apps, issue #18) must use this same file so the first sync is a no-op.
configs:
  cm:
    # Argo CD no longer assesses child Application health by default; without
    # this, app-of-apps sync waves would not wait for CRD providers to be Healthy.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
  params:
    # TLS terminates at kubectl port-forward locally; no ingress in kind.
    server.insecure: true

dex:
  enabled: false

notifications:
  enabled: false
