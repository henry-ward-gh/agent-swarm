{{- /*
  One Application per entry in .Values.platform. Anything sourced from this
  repo (Argo CD's values file, `path:` entries such as Outside World and Swarms) follows .Values.targetRevision
  (ADR 0005) — never hard-code a revision here. Upstream charts (Tetragon,
  secret-generator) pin their own chart version via values.
*/}}
{{- range $name, $app := .Values.platform }}
{{- $isArgo := eq $name "argocd" }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: agent-swarm
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.wave | quote }}
spec:
  project: default
  {{- if $isArgo }}
  sources:
    - repoURL: {{ $.Values.argocd.repoURL }}
      chart: {{ $.Values.argocd.chart }}
      targetRevision: {{ $.Values.argocd.version | quote }}
      helm:
        releaseName: argocd
        valueFiles:
          - $values/{{ $app.valuesFile }}
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: {{ $.Values.targetRevision }}
      ref: values
  {{- else if $app.path }}
  {{- /* A chart in this repo: follows the root's revision, and (followImageTag) its image tag. */}}
  {{- $values := deepCopy ($app.values | default dict) }}
  {{- if $app.followImageTag }}
  {{- $values = mustMergeOverwrite $values (dict "global" (dict "image" (dict "tag" $.Values.imageTag))) }}
  {{- end }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.targetRevision }}
    path: {{ $app.path }}
    {{- if $values }}
    helm:
      valuesObject:
        {{- toYaml $values | nindent 8 }}
    {{- end }}
  {{- else }}
  source:
    repoURL: {{ $app.repoURL }}
    chart: {{ $app.chart }}
    targetRevision: {{ $app.version | quote }}
    {{- with $app.values }}
    helm:
      valuesObject:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace }}
  syncPolicy:
    automated:
      prune: {{ if hasKey $app "prune" }}{{ $app.prune }}{{ else }}true{{ end }}
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  {{- with $app.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
