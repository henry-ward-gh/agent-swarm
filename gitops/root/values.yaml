# Set by the Terraform-owned root app (terraform/modules/argocd-bootstrap).
targetRevision: main
repoURL: https://github.com/henry-ward-gh/agent-swarm.git
imageTag: dev

# Argo CD's own chart pin. The Terraform bootstrap installs exactly this; the
# self-managed Argo CD app (issue #18) must render from the same values so a
# fresh cluster's first sync is a no-op (ADR 0005).
argocd:
  repoURL: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 9.7.1

# Platform apps rendered as child Applications by templates/platform-apps.yaml.
# Sync waves order them: lower syncs (and must be Healthy) first. CRD providers
# sit below 0 so anything that uses their CRDs (Swarm apps, wave >= 0) waits.
# Per-app `ignoreDifferences` is passed straight through (Swarm apps need it on
# the broker Secret's /data, which the secret-generator fills).
platform:
  argocd:
    wave: -2
    namespace: argocd
    # Never prune: a bad commit must not delete Argo CD (ADR 0005).
    prune: false
    # Same chart + values file the Terraform bootstrap installs. repo/chart/
    # version come from `argocd:` above.
    valuesFile: gitops/platform/argocd/values.yaml
  tetragon:
    wave: -1
    namespace: kube-system
    prune: true
    repoURL: https://helm.cilium.io
    chart: tetragon
    # Overridable (--set platform.tetragon.version=...), e.g. for a nightly run on the latest release.
    version: 1.8.0
    values:
      tetragon:
        # kind mounts the node's /proc at /procHost (terraform/modules/cluster-kind).
        hostProcPath: /procHost
        # kind nodes share the host's bpffs (terraform/modules/cluster-kind), so every Tetragon
        # agent would pin a policy at the same path and the second to load fails with "file exists".
        # A per-node bpf dir keeps each agent's pins apart.
        extraEnv:
          - name: TETRAGON_BPF_DIR
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        # What Tetragon exports (to stdout, where Alloy ships it to Loki; the e2e harness reads it too).
        # Every kprobe event (the Guardrails are the only kprobe policies) plus execs by Swarm Agents (pods in a
        # swarm-* namespace named like an Agent: `namespace_regex` and `pod_regex` in one rule must both match).
        # Tetragon's default denylist (host, kube-system, cilium namespaces) stays in force.
        exportAllowList: |-
          {"event_set":["PROCESS_KPROBE"]}
          {"event_set":["PROCESS_EXEC"],"namespace_regex":["^swarm-"],"pod_regex":["^.+-(orchestrator|worker)-[a-z0-9]+-[a-z0-9]+$"]}
  # Observability for the Swarm activity dashboard: Prometheus + Grafana, Loki and Alloy all live in
  # `monitoring`. Short retention, nothing persisted: it's a demo, not a store.
  kube-prometheus-stack:
    wave: -1
    namespace: monitoring
    prune: true
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: 93.2.2
    values:
      # The operator mounts the webhook's TLS Secret, which only the (disabled) patch Job creates, so
      # TLS goes off with the webhooks or the operator Pod never starts.
      prometheusOperator:
        admissionWebhooks:
          enabled: false
        tls:
          enabled: false
      alertmanager:
        enabled: false
      nodeExporter:
        enabled: false
      kubeStateMetrics:
        enabled: false
      defaultRules:
        create: false
      # Only Tetragon (scraped via the observability chart's ServiceMonitor) matters; skip the Kubernetes
      # component scrapes and their dashboards.
      kubeApiServer:
        enabled: false
      kubelet:
        enabled: false
      kubeControllerManager:
        enabled: false
      kubeScheduler:
        enabled: false
      kubeProxy:
        enabled: false
      kubeEtcd:
        enabled: false
      coreDns:
        enabled: false
      grafana:
        defaultDashboardsEnabled: false
        # Local demo only; reach Grafana with `task grafana:ui`.
        adminPassword: admin
      prometheus:
        prometheusSpec:
          retention: 6h
          # Select every ServiceMonitor, not just ones carrying this release's label.
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
  # Loki's OSS chart moved to grafana-community in March 2026; grafana/helm-charts only carries the
  # Enterprise Logs one now.
  loki:
    wave: -1
    namespace: monitoring
    prune: true
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    version: 21.2.1
    values:
      deploymentMode: Monolithic
      loki:
        auth_enabled: false
        commonConfig:
          replication_factor: 1
        storage:
          type: filesystem
        # Nothing is persisted; keep the last 6 hours, like Prometheus.
        limits_config:
          retention_period: 6h
        compactor:
          retention_enabled: true
          delete_request_store: filesystem
        schemaConfig:
          configs:
            - from: "2024-04-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
      singleBinary:
        replicas: 1
        persistence:
          enabled: false
      # The chart refuses to render with any of these above zero in Monolithic mode.
      read:
        replicas: 0
      write:
        replicas: 0
      backend:
        replicas: 0
      # Query Loki directly at loki.monitoring.svc:3100; no gateway, caches, canary or tests.
      gateway:
        enabled: false
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false
      lokiCanary:
        enabled: false
      test:
        enabled: false
  # The observability chart's ConfigMaps (Alloy config, Loki datasource, dashboard) and the Tetragon
  # ServiceMonitor. Wave 0: the ServiceMonitor CRD comes from kube-prometheus-stack (wave -1).
  observability:
    wave: 0
    namespace: monitoring
    prune: true
    path: gitops/platform/observability
  # Same wave and namespace as `observability`: the Alloy pods wait for its `alloy-config` ConfigMap.
  alloy:
    wave: 0
    namespace: monitoring
    prune: true
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    version: 1.15.0
    values:
      crds:
        create: false
      alloy:
        configMap:
          create: false
          name: alloy-config
          key: config.alloy
        extraEnv:
          # Keep LOKI_URL in step with gitops/platform/observability/values.yaml `lokiURL`.
          - name: LOKI_URL
            value: http://loki.monitoring.svc:3100
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
  secret-generator:
    wave: -1
    namespace: secret-generator
    prune: true
    repoURL: https://helm.mittwald.de
    chart: kubernetes-secret-generator
    version: 3.4.1
  # Outside World stand-ins (ADR 0003): the Approved Destination and the Exfil Sink.
  outside-world:
    wave: 0
    namespace: outside-world
    prune: true
    path: gitops/platform/outside-world
    values:
      servers:
        approved-api:
          # Keep in step with demo's worker.egress.allow below.
          clusterIP: 10.96.0.120
  # The demo Swarm. Wave 1: its Guardrails (TracingPolicyNamespaced) need Tetragon's CRDs, and its
  # Scenarios need Outside World. Add more Swarms the same way.
  demo:
    wave: 1
    namespace: swarm-demo
    prune: true
    path: agents/charts/swarm
    followImageTag: true
    # Its TracingPolicyNamespaced objects get CRD defaults that a client-side diff reports as OutOfSync.
    serverSideDiff: true
    values:
      global:
        swarm: demo
      broker:
        clusterIP: 10.96.0.110
      guardrails:
        enabled: true
      worker:
        egress:
          allow:
            - 10.96.0.120:8080
    # The secret-generator fills the broker Secret's data; self-heal would wipe it.
    ignoreDifferences:
      - kind: Secret
        name: demo-broker
        jsonPointers:
          - /data
