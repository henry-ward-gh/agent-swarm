apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swarm.name" . }}-broker
  labels:
    {{- include "swarm.brokerLabels" . | nindent 4 }}
  {{- if not .Values.broker.password }}
  annotations:
    # Filled in-cluster by the secret-generator controller (ADR 0004).
    secret-generator.v1.mittwald.de/autogenerate: password
  {{- end }}
type: Opaque
{{- with .Values.broker.password }}
stringData:
  password: {{ . | quote }}
{{- end }}
