apiVersion: v1
kind: Service
metadata:
  name: {{ include "swarm.name" . }}-valkey
  labels:
    {{- include "swarm.brokerLabels" . | nindent 4 }}
spec:
  {{- with .Values.broker.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
    {{- include "swarm.brokerLabels" . | nindent 4 }}
  ports:
    - name: valkey
      port: {{ .Values.broker.port }}
      targetPort: valkey
