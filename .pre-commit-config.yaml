repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: /templates/
      - id: detect-private-key
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.5
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/.tflint.hcl]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-metaschema
        files: ^protocol/.*\.schema\.json$
      - id: check-jsonschema
        name: validate protocol examples (goal)
        files: ^protocol/examples/goal\..*\.json$
        args: [--schemafile, protocol/goal.schema.json]
      - id: check-jsonschema
        name: validate protocol examples (task)
        files: ^protocol/examples/task\..*\.json$
        args: [--schemafile, protocol/task.schema.json]
      - id: check-jsonschema
        name: validate protocol examples (result)
        files: ^protocol/examples/result\..*\.json$
        args: [--schemafile, protocol/result.schema.json]
      - id: check-jsonschema
        name: validate protocol examples (task-event)
        files: ^protocol/examples/task-event\..*\.json$
        args: [--schemafile, protocol/task-event.schema.json]
